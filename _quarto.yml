profile:
  group:
    - [en, ja]

project:
  type: book
  execute-dir: project
  output-dir: docs
  render:
    - index.qmd
    - notebooks/*.qmd
    - "!local-reports/**"
  resources:
    - /data/manual/mesh_climate_data_labels.csv
    - /R/get_nearest_climate_value.R
    - /R/pipeline_p0_et0.R
    - /R/et0_support.R
    - /data/examples/et0_daily_synthetic.csv
    - /data/examples/et0_monthly_synthetic.csv
    - "!/local-reports/**"

book:
  title: "Climate Calculations for Japan"
  repo-url: https://github.com/maple60/japanese-climate-calculation

number-sections: false
bibliography: notebooks/references.bib
filters:
  - filters/language-title.lua

# Existing JMA/MLIT examples remain illustrative. The ET0 chapter overrides
# this to execute its synthetic examples, while its real-data chunk stays off.
execute:
  eval: false

format:
  html:
    code-overflow: wrap
    code-tools: true
    code-link: true
    theme: cosmo
    css: language-switch.css
    include-after-body: language-switch.html
